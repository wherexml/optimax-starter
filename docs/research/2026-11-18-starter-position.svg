<title id="title">OptiMax Starter：当前架构与后端差距</title>
<desc id="desc">蓝色为已在源码中核对的能力，橙色虚线框为演进建议。当前为 React Vite 前端、Hono Node 单体 API、PostgreSQL，以及可选模型筛选。建议先完善交付可靠性和模块升级，再按业务场景补基础服务与组织授权。</desc>
