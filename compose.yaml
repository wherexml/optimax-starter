name: optimax-starter-preview
x-app: &app
  build: .
  image: optimax-starter-preview:local
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${STARTER_DB_PASSWORD:?Set STARTER_DB_PASSWORD in .env}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:${API_PORT:-38141}:${API_PORT:-38141}"]
    environment:
      STARTER_ADMIN_USERNAME: ${STARTER_ADMIN_USERNAME:-demo@optimax.hk}
      STARTER_ADMIN_PASSWORD: ${STARTER_ADMIN_PASSWORD:?Run scripts/init-local.sh}
      STARTER_SEED_DEMO: ${STARTER_SEED_DEMO:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-optimax_console}
      PORT: ${API_PORT:-38141}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:${WEB_PORT:-38140}}
      STARTER_MAGPIE_RELAY_URL: ${STARTER_MAGPIE_RELAY_URL:-}
      STARTER_MAGPIE_MODEL: ${STARTER_MAGPIE_MODEL:-}
      # Server-side model client; empty = disabled. The key is a read-only file mounted by an
      # override (e.g. a Compose secret at /run/secrets/...); only its path is set here.
      STARTER_AI_BASE_URL: ${STARTER_AI_BASE_URL:-}
      STARTER_AI_MODEL: ${STARTER_AI_MODEL:-}
      STARTER_AI_API_KEY_FILE: ${STARTER_AI_API_KEY_FILE:-}
      STARTER_AI_CA_FILE: ${STARTER_AI_CA_FILE:-}
      STARTER_AI_ALLOW_HTTP_HOSTS: ${STARTER_AI_ALLOW_HTTP_HOSTS:-}
      STARTER_AI_TOKEN_FIELD: ${STARTER_AI_TOKEN_FIELD:-}
      STARTER_AI_TIMEOUT_MS: ${STARTER_AI_TIMEOUT_MS:-}
      STARTER_AI_CONCURRENCY: ${STARTER_AI_CONCURRENCY:-}
      STARTER_AI_QUEUE_LIMIT: ${STARTER_AI_QUEUE_LIMIT:-}
      STARTER_AI_QUEUE_WAIT_MS: ${STARTER_AI_QUEUE_WAIT_MS:-}
      STARTER_AI_ACTOR_LIMIT: ${STARTER_AI_ACTOR_LIMIT:-}
      DATABASE_URL: postgres://starter:${STARTER_DB_PASSWORD}@db:5432/starter
    # Bun only runs the short db:push step; the long-running API runs on Node 24 (see RUNTIME.md).
    command: ["sh", "-ec", "bun run db:push && cd apps/server && exec node --import tsx src/node.ts"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||38141)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 10s
      timeout: 3s
      retries: 3
  api-laravel:
    # Laravel 13 迁移栈（LARAVEL.md 阶段 B）：与 api 并行运行，不接管前端流量。
    build:
      context: apps/api-laravel
      dockerfile: Dockerfile.dev
    image: optimax-starter-laravel:local
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:${API_LARAVEL_PORT:-38142}:8080"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug
      DATABASE_URL: postgres://starter:${STARTER_DB_PASSWORD}@db:5432/starter
      # 契约产物（packages/api/json-schema 经 compose.override 挂载；LB-03 消费）。
      CONTRACTS_DIR: /var/www/html/storage/contracts
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-optimax_console}
      STARTER_ADMIN_USERNAME: ${STARTER_ADMIN_USERNAME:-demo@optimax.hk}
      STARTER_SEED_DEMO: ${STARTER_SEED_DEMO:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:${WEB_PORT:-38140}}
      PHP_CLI_SERVER_WORKERS: "4"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/console/health"]
      start_period: 15s
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    <<: *app
    ports: ["127.0.0.1:${WEB_PORT:-38140}:${WEB_PORT:-38140}"]
    environment:
      WEB_PORT: ${WEB_PORT:-38140}
      API_PORT: ${API_PORT:-38141}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:${API_PORT:-38141}}
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://127.0.0.1:${API_PORT:-38141}}
      VITE_APP_SLUG: ${VITE_APP_SLUG:-optimax-starter}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-OptiMax}
      VITE_ENABLE_DEMOS: ${VITE_ENABLE_DEMOS:-true}
    command: ["sh", "-ec", "cd apps/web && exec bun run dev"]
volumes:
  data:
