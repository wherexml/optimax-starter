name: optimax-starter-preview
x-app: &app
  build: .
  image: optimax-starter-preview:local
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${STARTER_DB_PASSWORD:?Set STARTER_DB_PASSWORD in .env}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:38141:38141"]
    environment:
      STARTER_ADMIN_PASSWORD: ${STARTER_ADMIN_PASSWORD:?Run scripts/init-local.sh}
      PORT: 38141
      CORS_ORIGIN: http://127.0.0.1:38140
      DATABASE_URL: postgres://starter:${STARTER_DB_PASSWORD}@db:5432/starter
    # Bun only runs the short db:push step; the long-running API runs on Node 24 (see RUNTIME.md).
    command: ["sh", "-ec", "bun run db:push && cd apps/server && exec node --import tsx src/node.ts"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:38141/').then(async r=>process.exit(r.ok&&(await r.text())==='OK'?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    <<: *app
    ports: ["127.0.0.1:38140:38140"]
    environment:
      VITE_SERVER_URL: http://127.0.0.1:38141
    command: ["sh", "-ec", "cd apps/web && exec bun run dev"]
volumes:
  data:
