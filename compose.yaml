name: optimax-starter-preview
x-app: &app
  build: .
  image: optimax-starter-preview:local
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${STARTER_DB_PASSWORD:?Set STARTER_DB_PASSWORD in .env}
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 3s
      timeout: 3s
      retries: 15
  api:
    <<: *app
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:${API_PORT:-38141}:${API_PORT:-38141}"]
    environment:
      STARTER_ADMIN_USERNAME: ${STARTER_ADMIN_USERNAME:-demo@optimax.hk}
      STARTER_ADMIN_PASSWORD: ${STARTER_ADMIN_PASSWORD:?Run scripts/init-local.sh}
      STARTER_SEED_DEMO: ${STARTER_SEED_DEMO:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-optimax_console}
      PORT: ${API_PORT:-38141}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:${WEB_PORT:-38140}}
      STARTER_MAGPIE_RELAY_URL: ${STARTER_MAGPIE_RELAY_URL:-}
      STARTER_MAGPIE_MODEL: ${STARTER_MAGPIE_MODEL:-}
      # Server-side model client; empty = disabled. The key is a read-only file mounted by an
      # override (e.g. a Compose secret at /run/secrets/...); only its path is set here.
      STARTER_AI_BASE_URL: ${STARTER_AI_BASE_URL:-}
      STARTER_AI_MODEL: ${STARTER_AI_MODEL:-}
      STARTER_AI_API_KEY_FILE: ${STARTER_AI_API_KEY_FILE:-}
      STARTER_AI_CA_FILE: ${STARTER_AI_CA_FILE:-}
      STARTER_AI_ALLOW_HTTP_HOSTS: ${STARTER_AI_ALLOW_HTTP_HOSTS:-}
      STARTER_AI_TOKEN_FIELD: ${STARTER_AI_TOKEN_FIELD:-}
      STARTER_AI_TIMEOUT_MS: ${STARTER_AI_TIMEOUT_MS:-}
      STARTER_AI_CONCURRENCY: ${STARTER_AI_CONCURRENCY:-}
      STARTER_AI_QUEUE_LIMIT: ${STARTER_AI_QUEUE_LIMIT:-}
      STARTER_AI_QUEUE_WAIT_MS: ${STARTER_AI_QUEUE_WAIT_MS:-}
      STARTER_AI_ACTOR_LIMIT: ${STARTER_AI_ACTOR_LIMIT:-}
      # @starter:agent-start
      # Assistant runtime. STARTER_AI_CONFIG_KEY_FILE (64-hex key file path) enables console-managed
      # model settings; empty keeps the deployment credentials read-only.
      STARTER_AI_PROTOCOL: ${STARTER_AI_PROTOCOL:-}
      STARTER_AI_STRUCTURED_MODE: ${STARTER_AI_STRUCTURED_MODE:-}
      STARTER_AI_CONFIG_KEY_FILE: ${STARTER_AI_CONFIG_KEY_FILE:-}
      STARTER_AI_ALLOWED_ORIGINS: ${STARTER_AI_ALLOWED_ORIGINS:-}
      STARTER_AI_MODEL_LABEL: ${STARTER_AI_MODEL_LABEL:-}
      STARTER_AGENT_SKILLS_DIR: ${STARTER_AGENT_SKILLS_DIR:-}
      # @starter:agent-end
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_SSO_ENABLED: ${AUTH_SSO_ENABLED:-false}
      AUTH_SSO_LABEL: ${AUTH_SSO_LABEL:-}
      AUTH_SSO_LOGIN_PATH: ${AUTH_SSO_LOGIN_PATH:-}
      AUTH_OIDC_ENABLED: ${AUTH_OIDC_ENABLED:-false}
      AUTH_OIDC_PROVIDER_ID: ${AUTH_OIDC_PROVIDER_ID:-oidc}
      AUTH_OIDC_LABEL: ${AUTH_OIDC_LABEL:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      # OIDC client secret: mount a private file and set only its path.
      AUTH_OIDC_CLIENT_SECRET_FILE: ${AUTH_OIDC_CLIENT_SECRET_FILE:-}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-openid profile email}
      AUTH_OIDC_REDIRECT_URI: ${AUTH_OIDC_REDIRECT_URI:-}
      AUTH_OIDC_ALLOW_EMAIL_LINK: ${AUTH_OIDC_ALLOW_EMAIL_LINK:-true}
      # Attachments + async export artifacts. Absolute path inside the persistent `uploads` volume.
      STARTER_UPLOAD_DIR: ${STARTER_UPLOAD_DIR:-/app/data/uploads}
      STARTER_UPLOAD_MAX_BYTES: ${STARTER_UPLOAD_MAX_BYTES:-10485760}
      STARTER_STORAGE_DRIVER: ${STARTER_STORAGE_DRIVER:-local}
      STARTER_S3_ENDPOINT: ${STARTER_S3_ENDPOINT:-}
      STARTER_S3_BUCKET: ${STARTER_S3_BUCKET:-}
      STARTER_S3_REGION: ${STARTER_S3_REGION:-}
      STARTER_S3_ACCESS_KEY_ID: ${STARTER_S3_ACCESS_KEY_ID:-}
      # S3 secret: mount a private file and set only its path.
      STARTER_S3_SECRET_ACCESS_KEY_FILE: ${STARTER_S3_SECRET_ACCESS_KEY_FILE:-}
      STARTER_JOBS_ENABLED: ${STARTER_JOBS_ENABLED:-true}
      DATABASE_URL: postgres://starter:${STARTER_DB_PASSWORD}@db:5432/starter
    volumes:
      - uploads:/app/data/uploads
    # Bun only runs the short db:push step; the long-running API runs on Node 24 (see RUNTIME.md).
    command: ["sh", "-ec", "bun run db:push && cd apps/server && exec node --import tsx src/node.ts"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||38141)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    <<: *app
    ports: ["127.0.0.1:${WEB_PORT:-38140}:${WEB_PORT:-38140}"]
    environment:
      WEB_PORT: ${WEB_PORT:-38140}
      API_PORT: ${API_PORT:-38141}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://api:${API_PORT:-38141}}
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://127.0.0.1:${API_PORT:-38141}}
      VITE_APP_SLUG: ${VITE_APP_SLUG:-optimax-starter}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-OptiMax}
      VITE_ENABLE_DEMOS: ${VITE_ENABLE_DEMOS:-true}
    command: ["sh", "-ec", "cd apps/web && exec bun run dev"]
volumes:
  data:
  uploads:
