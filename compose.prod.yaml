name: ${STARTER_PROD_PROJECT:-optimax-starter-prod}
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${STARTER_DB_PASSWORD:?Set STARTER_DB_PASSWORD in .env.production}
    volumes:
      - prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s
      timeout: 3s
      retries: 15
  # D2 终态（LD-04）：迁移权威在 Laravel。一次性前置服务复用 app 镜像，
  # 启动前执行 artisan migrate（基线迁移含双轨过渡守卫，存量 Drizzle 卷自动登记）。
  migrate:
    image: ${STARTER_PROD_IMAGE:-optimax-starter-prod:release}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DATABASE_URL: postgres://starter:${STARTER_DB_PASSWORD}@db:5432/starter
    command: ["php", "artisan", "migrate", "--force"]
  # 单 app 容器（D6）：Laravel API 与前端静态页同容器（FrankenPHP）。
  app:
    build:
      context: .
      dockerfile: apps/api-laravel/Dockerfile.prod
      args:
        VITE_APP_SLUG: ${VITE_APP_SLUG:-optimax-starter}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-OptiMax}
        VITE_ENABLE_DEMOS: "false"
        VITE_SERVER_URL: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
    image: ${STARTER_PROD_IMAGE:-optimax-starter-prod:release}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    ports: ["127.0.0.1:${PROD_PORT:-38140}:8080"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env.production}
      # 签名 URL 基址（LD-02）：附件签名下载必须公网可解析。
      APP_URL: ${APP_URL:?Set APP_URL in .env.production}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      # D2 零迁移：无 Laravel cache 表，文件 store（LB-07）。
      CACHE_STORE: file
      # 镜像不带 .env（运行态只走 compose 注入）：默认连接必须显式给 pgsql。
      DB_CONNECTION: pgsql
      DATABASE_URL: postgres://starter:${STARTER_DB_PASSWORD}@db:5432/starter
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?Set SESSION_COOKIE_NAME in .env.production}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-480}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      STARTER_SEED_DEMO: "false"
      # asset-agent 桥上游（D5）：默认未启用（503 明确语义）；挂 compose.ai.prod.yaml 时
      # 由 overlay 注入 http://ai:38141。
      STARTER_NODE_API_URL: ${STARTER_NODE_API_URL:-}
      # 附件盘（LD-02/D8）：local 挂下方卷；S3 兼容 OSS 配 ATTACHMENT_S3_* 并设 s3。
      ATTACHMENT_DISK: ${ATTACHMENT_DISK:-local}
    volumes:
      - prod_attachments:/srv/storage/app/attachments
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      start_period: 20s
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  prod_data:
  prod_attachments:
