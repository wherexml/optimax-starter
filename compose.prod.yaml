name: ${STARTER_PROD_PROJECT:-optimax-starter-prod}
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${STARTER_DB_PASSWORD:?Set STARTER_DB_PASSWORD in .env.production}
    volumes:
      - prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        VITE_APP_SLUG: ${VITE_APP_SLUG:-optimax-starter}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-OptiMax}
        VITE_ENABLE_DEMOS: "false"
        VITE_SERVER_URL: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
    image: ${STARTER_PROD_IMAGE:-optimax-starter-prod:release}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    ports: ["127.0.0.1:${PROD_PORT:-38140}:38140"]
    environment:
      NODE_ENV: production
      PORT: 38140
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.production}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?Set SESSION_COOKIE_NAME in .env.production}
      STARTER_SEED_DEMO: "false"
      STARTER_ADMIN_USERNAME: ${STARTER_ADMIN_USERNAME:-}
      STARTER_ADMIN_PASSWORD: ${STARTER_ADMIN_PASSWORD:-}
      SERVE_WEB_DIST: /app/apps/web/dist
      STARTER_AI_BASE_URL: ${STARTER_AI_BASE_URL:-}
      STARTER_AI_MODEL: ${STARTER_AI_MODEL:-}
      STARTER_AI_API_KEY_FILE: ${STARTER_AI_API_KEY_FILE:-}
      STARTER_AI_CA_FILE: ${STARTER_AI_CA_FILE:-}
      STARTER_AI_TOKEN_FIELD: ${STARTER_AI_TOKEN_FIELD:-}
      STARTER_AI_TIMEOUT_MS: ${STARTER_AI_TIMEOUT_MS:-}
      STARTER_AI_CONCURRENCY: ${STARTER_AI_CONCURRENCY:-}
      STARTER_AI_QUEUE_LIMIT: ${STARTER_AI_QUEUE_LIMIT:-}
      STARTER_AI_QUEUE_WAIT_MS: ${STARTER_AI_QUEUE_WAIT_MS:-}
      STARTER_AI_ACTOR_LIMIT: ${STARTER_AI_ACTOR_LIMIT:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_SSO_ENABLED: ${AUTH_SSO_ENABLED:-false}
      AUTH_SSO_LABEL: ${AUTH_SSO_LABEL:-}
      AUTH_SSO_LOGIN_PATH: ${AUTH_SSO_LOGIN_PATH:-}
      AUTH_OIDC_ENABLED: ${AUTH_OIDC_ENABLED:-false}
      AUTH_OIDC_PROVIDER_ID: ${AUTH_OIDC_PROVIDER_ID:-oidc}
      AUTH_OIDC_LABEL: ${AUTH_OIDC_LABEL:-}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      # OIDC client secret: mount a private file and set only its path.
      AUTH_OIDC_CLIENT_SECRET_FILE: ${AUTH_OIDC_CLIENT_SECRET_FILE:-}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-openid profile email}
      AUTH_OIDC_REDIRECT_URI: ${AUTH_OIDC_REDIRECT_URI:-}
      AUTH_OIDC_ALLOW_EMAIL_LINK: ${AUTH_OIDC_ALLOW_EMAIL_LINK:-true}
      AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-true}
      AUTH_FEISHU_ENABLED: ${AUTH_FEISHU_ENABLED:-false}
      AUTH_FEISHU_APP_ID: ${AUTH_FEISHU_APP_ID:-}
      # Feishu app secret: mount a private file and set only its path.
      AUTH_FEISHU_APP_SECRET_FILE: ${AUTH_FEISHU_APP_SECRET_FILE:-}
      AUTH_FEISHU_TENANT_KEY: ${AUTH_FEISHU_TENANT_KEY:-}
      AUTH_FEISHU_LABEL: ${AUTH_FEISHU_LABEL:-使用飞书登录}
      AUTH_FEISHU_REDIRECT_URI: ${AUTH_FEISHU_REDIRECT_URI:-}
      AUTH_FEISHU_ALLOW_EMAIL_LINK: ${AUTH_FEISHU_ALLOW_EMAIL_LINK:-true}
      AUTH_FEISHU_AUTO_PROVISION: ${AUTH_FEISHU_AUTO_PROVISION:-false}
      # Attachments + async export artifacts. Absolute path inside the persistent `uploads` volume.
      STARTER_UPLOAD_DIR: ${STARTER_UPLOAD_DIR:-/app/data/uploads}
      STARTER_UPLOAD_MAX_BYTES: ${STARTER_UPLOAD_MAX_BYTES:-10485760}
      STARTER_STORAGE_DRIVER: ${STARTER_STORAGE_DRIVER:-local}
      STARTER_S3_ENDPOINT: ${STARTER_S3_ENDPOINT:-}
      STARTER_S3_BUCKET: ${STARTER_S3_BUCKET:-}
      STARTER_S3_REGION: ${STARTER_S3_REGION:-}
      STARTER_S3_ACCESS_KEY_ID: ${STARTER_S3_ACCESS_KEY_ID:-}
      # S3 secret: mount a private file and set only its path.
      STARTER_S3_SECRET_ACCESS_KEY_FILE: ${STARTER_S3_SECRET_ACCESS_KEY_FILE:-}
      STARTER_JOBS_ENABLED: ${STARTER_JOBS_ENABLED:-true}
      DATABASE_URL: postgres://starter:${STARTER_DB_PASSWORD}@db:5432/starter
    volumes:
      - uploads:/app/data/uploads
    # Always applies committed versioned migrations (packages/db/src/migrations) before starting; never db:push in production.
    command:
      - sh
      - -ec
      - |
        bun run --filter @optimax-starter/db db:migrate:deploy
        cd apps/server && exec node dist/node.mjs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:38140/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 20s
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  prod_data:
  uploads:
